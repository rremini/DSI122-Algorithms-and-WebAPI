<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Circular Doubly Linked List Animation</title>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 40px;
    background: #f4f6f8;
  }
  .container {
    display: flex;
    gap: 40px;
    position: relative;
    padding: 60px 40px;
    border: 2px dashed #999;
    border-radius: 12px;
    background: #fff;
  }
  .node {
    width: 100px;
    height: 70px;
    border: 2px solid #2b6cb0;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #ebf8ff;
    position: relative;
    font-weight: bold;
    transition: background 0.3s;
  }
  .active {
    background: #48bb78 !important;
    color: white;
    box-shadow: 0 0 12px rgba(72, 187, 120, 0.8);
  }
  .label {
    font-size: 11px;
    color: #4a5568;
    margin-top: 4px;
  }
  .controls {
    margin-top: 25px;
    display: flex;
    gap: 12px;
  }
  button {
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #3182ce;
    color: white;
  }
  button:hover {
    background: #2b6cb0;
  }
  .status {
    margin-top: 15px;
    font-size: 16px;
    color: #2d3748;
  }
</style>
</head>
<body>

  <h2>Circular Doubly Linked List Loop Animation</h2>
  
  <div class="container">
    <div class="node active" id="node0">
      Node A
      <span class="label">head</span>
    </div>
    <div class="node" id="node1">
      Node B
      <span class="label">data: 2</span>
    </div>
    <div class="node" id="node2">
      Node C
      <span class="label">tail</span>
    </div>
  </div>

  <div class="status" id="statusText">Current Node: Node A (head)</div>

  <div class="controls">
    <button onclick="moveNext()">Next ➔ (เดินหน้าตาม Loop)</button>
    <button onclick="movePrev()">⬅ Prev (ถอยหลังตาม Loop)</button>
    <button onclick="toggleAuto()">Auto Play / Pause</button>
  </div>

<script>
  let currentIndex = 0;
  const nodes = ['Node A (head)', 'Node B', 'Node C (tail)'];
  let timer = null;

  function updateVisual() {
    for (let i = 0; i < 3; i++) {
      document.getElementById('node' + i).classList.remove('active');
    }
    document.getElementById('node' + currentIndex).classList.add('active');
    document.getElementById('statusText').innerText = 'Current Node: ' + nodes[currentIndex];
  }

  function moveNext() {
    // next ของ tail จะวนกลับมา index 0
    currentIndex = (currentIndex + 1) % 3;
    updateVisual();
  }

  function movePrev() {
    // prev ของ head จะวนไป index 2 (tail)
    currentIndex = (currentIndex - 1 + 3) % 3;
    updateVisual();
  }

  function toggleAuto() {
    if (timer) {
      clearInterval(timer);
      timer = null;
    } else {
      timer = setInterval(moveNext, 1000);
    }
  }
</script>

</body>
</html>
